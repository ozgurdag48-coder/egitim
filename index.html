<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eğitim Bilimleri Online Test Portalı</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 font-sans min-h-screen flex flex-col justify-between">

    <header class="bg-blue-600 text-white shadow-md p-4 text-center">
        <h1 class="text-2xl font-bold tracking-wide">Eğitim Bilimleri Online Testi</h1>
        <p class="text-sm text-blue-100 mt-1">KPSS Hazırlık Platformu</p>
    </header>

    <main class="container mx-auto max-w-3xl p-4 flex-grow flex flex-col justify-center">
        
        <div id="category-screen" class="bg-white rounded-xl shadow-lg p-6 md:p-8">
            <h2 class="text-xl font-bold text-gray-800 mb-4 text-center">Lütfen Test Etmek İstediğiniz Alanı Seçiniz</h2>
            <div id="categories-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                </div>
        </div>

        <div id="quiz-screen" class="bg-white rounded-xl shadow-lg p-6 md:p-8 hidden">
            <div class="flex justify-between items-center border-b border-gray-100 pb-4 mb-4">
                <span id="quiz-title" class="text-sm font-semibold text-blue-600 uppercase tracking-wider">Kategori</span>
                <span id="progress" class="text-sm text-gray-500 font-medium">Soru: 1/10</span>
            </div>

            <div class="mb-6">
                <p id="question-text" class="text-lg text-gray-800 font-semibold leading-relaxed">Soru metni buraya gelecek.</p>
            </div>

            <div id="options-container" class="space-y-3">
                </div>

            <div class="mt-6 flex justify-end">
                <button id="next-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 px-6 rounded-lg transition-colors duration-200 hidden shadow-md">
                    Sonraki Soru <i class="fas fa-arrow-right ml-2"></i>
                </button>
            </div>
        </div>

        <div id="result-screen" class="bg-white rounded-xl shadow-lg p-6 md:p-8 text-center hidden">
            <div class="text-6xl text-yellow-500 mb-4">
                <i class="fas fa-trophy"></i>
            </div>
            <h2 class="text-2xl font-bold text-gray-800 mb-2">Tebrikler! Testi Tamamladınız.</h2>
            <p id="category-result-title" class="text-gray-600 mb-4 font-medium"></p>
            
            <div class="grid grid-cols-3 gap-4 max-w-sm mx-auto mb-8 bg-gray-50 p-4 rounded-xl">
                <div class="text-center">
                    <span class="block text-gray-500 text-xs uppercase font-bold">Toplam</span>
                    <span id="total-questions" class="text-xl font-bold text-gray-700">0</span>
                </div>
                <div class="text-center">
                    <span class="block text-emerald-600 text-xs uppercase font-bold">Doğru</span>
                    <span id="correct-count" class="text-xl font-bold text-emerald-600">0</span>
                </div>
                <div class="text-center">
                    <span class="block text-rose-600 text-xs uppercase font-bold">Yanlış</span>
                    <span id="wrong-count" class="text-xl font-bold text-rose-600">0</span>
                </div>
            </div>

            <button id="restart-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 px-6 rounded-lg transition-colors duration-200 shadow-md">
                <i class="fas fa-redo mr-2"></i> Yeni Test Başlat
                
            </button>
        </div>

    </main>

    <footer class="bg-gray-800 text-gray-400 p-3 text-center text-xs border-t border-gray-700">
        <p>&copy; 2026 Online Test Uygulaması. Tüm Hakları Saklıdır.</p>
        <p class="mt-1 text-gray-500">powered by ÖZGÜR DAĞ</p>
    </footer>

</body>
</html>
